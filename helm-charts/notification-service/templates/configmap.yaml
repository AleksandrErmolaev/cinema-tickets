apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}-config
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  KAFKA_BROKER: "{{ .Values.kafka.bootstrapServers }}"
  SMTP_HOST: "{{ .Values.smtp.host }}"
  SMTP_PORT: "{{ .Values.smtp.port }}"
  SMTP_USER: "{{ .Values.smtp.user }}"
  SMTP_PASS: "{{ .Values.smtp.password }}"
  FROM_EMAIL: "{{ .Values.smtp.fromEmail }}"