apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analytics-service.fullname" . }}-config
  labels:
    {{- include "analytics-service.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.bootstrapServers }}"
  MINIO_ENDPOINT: "{{ .Values.minio.endpoint }}"
  MINIO_ACCESS_KEY: "{{ .Values.minio.accessKey }}"
  MINIO_SECRET_KEY: "{{ .Values.minio.secretKey }}"
  MINIO_BUCKET: "{{ .Values.minio.bucket }}"
  MINIO_SECURE: "{{ .Values.minio.secure }}"
  HEALTH_PORT: "8006"