stages:
  - build-and-push
  - update-helm
  - sync-argocd

variables:
  CI_REGISTRY: "localhost:5000"
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/cinema-tickets"
  KANIKO_CACHE_REGISTRY: "${CI_REGISTRY}/kaniko-cache"
  ARGOCD_SERVER: "localhost:30080"

cache:
  paths:
    - /kaniko/cache

.build_template: &build_template
  stage: build-and-push
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - |
      if [ -n "${CI_REGISTRY_USER}" ] && [ -n "${CI_REGISTRY_PASSWORD}" ]; then
        echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
      fi
  script:
    - /kaniko/executor
      --context="${CI_PROJECT_DIR}/${SERVICE_PATH}"
      --dockerfile="${CI_PROJECT_DIR}/${SERVICE_PATH}/Dockerfile"
      --destination="${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination="${CI_REGISTRY_IMAGE}/${SERVICE_NAME}:latest"
      --cache=true
      --cache-repo="${KANIKO_CACHE_REGISTRY}/${SERVICE_NAME}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "${SERVICE_PATH}/**/*"

build-auth:
  <<: *build_template
  variables:
    SERVICE_NAME: "auth-service"
    SERVICE_PATH: "auth_service"

build-booking:
  <<: *build_template
  variables:
    SERVICE_NAME: "booking-service"
    SERVICE_PATH: "booking_service"

build-payment:
  <<: *build_template
  variables:
    SERVICE_NAME: "payment-service"
    SERVICE_PATH: "payment_service"

build-movie:
  <<: *build_template
  variables:
    SERVICE_NAME: "movie-service"
    SERVICE_PATH: "movie_service"

build-analytics:
  <<: *build_template
  variables:
    SERVICE_NAME: "analytics-service"
    SERVICE_PATH: "analytics_service"

build-notification:
  <<: *build_template
  variables:
    SERVICE_NAME: "notification-service"
    SERVICE_PATH: "notification_service"

update-helm:
  stage: update-helm
  image: alpine/git:latest
  before_script:
    - apk add --no-cache yq
    - git config --global user.email "ci@example.com"
    - git config --global user.name "CI Bot"
  script:
    - |
      for SERVICE in auth-service booking-service payment-service movie-service analytics-service notification-service; do
        yq eval -i ".image.tag = \"${CI_COMMIT_SHORT_SHA}\"" helm-charts/${SERVICE}/values.yaml
      done
    - git add helm-charts/
    - git commit -m "Update Helm charts tags to ${CI_COMMIT_SHORT_SHA} [skip ci]" || echo "No changes"
    - git push https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-auth
    - build-booking
    - build-payment
    - build-movie
    - build-analytics
    - build-notification

sync-argocd:
  stage: sync-argocd
  image: argoproj/argocd:latest
  script:
    - argocd login argocd-server.argocd.svc.cluster.local --insecure --username admin --password ${ARGOCD_ADMIN_PASSWORD}
    - argocd app sync auth-service --prune --force
    - argocd app sync booking-service --prune --force
    - argocd app sync payment-service --prune --force
    - argocd app sync movie-service --prune --force
    - argocd app sync analytics-service --prune --force
    - argocd app sync notification-service --prune --force
    - argocd app wait auth-service --health --sync --timeout 300
    - argocd app wait booking-service --health --sync --timeout 300
    - argocd app wait payment-service --health --sync --timeout 300
    - argocd app wait movie-service --health --sync --timeout 300
    - argocd app wait analytics-service --health --sync --timeout 300
    - argocd app wait notification-service --health --sync --timeout 300
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - update-helm
  variables:
    ARGOCD_ADMIN_PASSWORD: "admin"
    ARGOCD_SERVER: "localhost:30080"