apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movie-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AleksandrErmolaev/cinema-tickets.git
    targetRevision: main
    path: helm-charts/movie-service
  destination:
    server: https://kubernetes.default.svc
    namespace: movie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true