apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  microservices-overview.json: |
    {
      "title": "Microservices Overview",
      "uid": "microservices-overview",
      "panels": [
        {
          "title": "RPS (requests per second) by service",
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total[1m])) by (destination_service)",
              "legendFormat": "{{ destination_service }}"
            }
          ]
        },
        {
          "title": "p95 Latency (seconds) by service",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket[5m])) by (le, destination_service)) / 1000",
              "legendFormat": "{{ destination_service }} p95"
            }
          ]
        },
        {
          "title": "Error Rate (%) by service",
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"5..\"}[5m])) by (destination_service) / sum(rate(istio_requests_total[5m])) by (destination_service) * 100",
              "legendFormat": "{{ destination_service }}"
            }
          ]
        },
        {
          "title": "Active connections (TCP)",
          "targets": [
            {
              "expr": "sum(envoy_cluster_upstream_cx_active) by (cluster_name)"
            }
          ]
        }
      ]
    }
  kafka-dashboard.json: |
    {
      "title": "Kafka Dashboard",
      "uid": "kafka-dashboard",
      "panels": [
        {
          "title": "Consumer Lag",
          "targets": [
            {
              "expr": "kafka_consumer_lag"
            }
          ]
        },
        {
          "title": "Messages in per second",
          "targets": [
            {
              "expr": "rate(kafka_topic_partition_current_offset[1m])"
            }
          ]
        }
      ]
    }
  istio-mesh.json: |
    {
      "title": "Istio Mesh Dashboard",
      "uid": "istio-mesh-dashboard",
      "panels": [
        {
          "title": "Request volume (source → destination)",
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total[1m])) by (source_workload, destination_workload)"
            }
          ]
        },
        {
          "title": "Circuit breaker status (open circuits)",
          "targets": [
            {
              "expr": "envoy_cluster_upstream_cx_overflow"
            }
          ]
        }
      ]
    }