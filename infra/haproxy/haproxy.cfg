global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log global
    mode http
    option httplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http_front
    bind *:80
    default_backend istio_ingress

backend istio_ingress
    balance roundrobin
    option httpchk GET /healthz/ready
    server k8s-node1 192.168.56.11:32080 check inter 5s rise 2 fall 3
    server k8s-node2 192.168.56.12:32080 check inter 5s rise 2 fall 3