apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-service
  namespace: booking
spec:
  hosts:
  - booking-service.booking.svc.cluster.local
  http:
  - route:
    - destination:
        host: booking-service.booking.svc.cluster.local
    retries:
      attempts: 3
      perTryTimeout: 30s
      retryOn: "5xx,connect-failure"