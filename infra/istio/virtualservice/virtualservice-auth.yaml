apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: auth-service
  namespace: auth
spec:
  hosts:
  - auth-service.auth.svc.cluster.local
  http:
  - route:
    - destination:
        host: auth-service.auth.svc.cluster.local
    retries:
      attempts: 3
      perTryTimeout: 30s
      retryOn: "5xx,connect-failure,refused-stream,reset"
    timeout: 60s